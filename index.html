<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avlagaç</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
        Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      background-color: #f4f6f8;
      color: #1a1a2e;
    }

    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 75%, #533483 100%);
      padding: 2rem 3rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #e0e0e0;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    header h1 span {
      color: #e94560;
    }

    nav a {
      color: #c9d1d9;
      text-decoration: none;
      margin-left: 1.5rem;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: #e94560;
    }

    main {
      max-width: 900px;
      margin: 3rem auto;
      padding: 0 1.5rem;
    }

    main h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    main p {
      line-height: 1.7;
      color: #444;
    }
  </style>
</head>
<body>

  <header>
    <h1>Avla<span>gaç</span></h1>
    <nav>
      <a href="#">Ana Sayfa</a>
      <a href="#">Hakkında</a>
      <a href="#">İletişim</a>
    </nav>
  </header>

  <main>
    <h2>Hoş Geldiniz</h2>
    <p>Bu sayfa Avlagaç projesinin ana sayfasıdır.</p>
  </main>

</body>
</html>
