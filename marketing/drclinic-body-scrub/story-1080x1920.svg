<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%"   stop-color="#FFF0F4"/>
      <stop offset="40%"  stop-color="#FFE0EC"/>
      <stop offset="100%" stop-color="#FADDE6"/>
    </linearGradient>
    <!-- Circle accent gradient -->
    <radialGradient id="circleGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#FF8FAB"/>
      <stop offset="100%" stop-color="#C2185B"/>
    </radialGradient>
    <!-- Blob gradient -->
    <radialGradient id="blobGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFD6E2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFB3CA" stop-opacity="0.3"/>
    </radialGradient>
    <!-- Shadows -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#C2185B" flood-opacity="0.20"/>
    </filter>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#C2185B" flood-opacity="0.10"/>
    </filter>
    <filter id="textGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF8FAB" flood-opacity="0.40"/>
    </filter>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="1080" height="1920" fill="url(#bgGrad)"/>

  <!-- Large decorative circles -->
  <circle cx="1020" cy="160"  r="300" fill="#FFB3CA" opacity="0.20"/>
  <circle cx="60"   cy="1760" r="260" fill="#FFB3CA" opacity="0.18"/>
  <circle cx="20"   cy="960"  r="120" fill="#FF8FAB" opacity="0.10"/>
  <circle cx="1060" cy="1100" r="90"  fill="#FF8FAB" opacity="0.12"/>

  <!-- Small dots -->
  <circle cx="80"  cy="320"  r="20" fill="#FF8FAB" opacity="0.30"/>
  <circle cx="55"  cy="420"  r="12" fill="#C2185B" opacity="0.20"/>
  <circle cx="995" cy="700"  r="16" fill="#FF8FAB" opacity="0.28"/>
  <circle cx="1025" cy="800" r="9"  fill="#C2185B" opacity="0.18"/>
  <circle cx="75"  cy="1400" r="14" fill="#FF8FAB" opacity="0.28"/>
  <circle cx="1010" cy="1550" r="18" fill="#FFB3CA" opacity="0.35"/>
  <circle cx="55"  cy="1650" r="10" fill="#C2185B" opacity="0.18"/>

  <!-- ── TOP BRAND BAR ── -->
  <rect x="0" y="0" width="1080" height="110" fill="#C2185B" rx="0"/>
  <text x="540" y="68" font-family="Georgia, 'Times New Roman', serif"
        font-size="44" font-weight="bold" fill="#FFFFFF"
        text-anchor="middle" letter-spacing="8">DR.CLİNİC</text>
  <text x="540" y="96" font-family="Arial, Helvetica, sans-serif"
        font-size="18" fill="#FFD6E2" text-anchor="middle" letter-spacing="4">PROFESYONEL CİLT BAKIMI</text>

  <!-- ── PRODUCT VISUAL ── -->
  <!-- Blob -->
  <ellipse cx="540" cy="520" rx="350" ry="320" fill="url(#blobGrad)"/>
  <!-- Main circle -->
  <circle cx="540" cy="520" r="280" fill="url(#circleGrad)" filter="url(#shadow)"/>
  <!-- White ring -->
  <circle cx="540" cy="520" r="256" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.45"/>

  <!-- Product jar illustration -->
  <rect x="430" y="458" width="220" height="146" rx="22" fill="#FFFFFF" opacity="0.93"/>
  <rect x="418" y="432" width="244" height="36" rx="14" fill="#FFFFFF" opacity="0.82"/>
  <rect x="430" y="498" width="220" height="62" rx="0" fill="#FFE0EC" opacity="0.88"/>
  <text x="540" y="522" font-family="Georgia, serif" font-size="14" font-weight="bold"
        fill="#C2185B" text-anchor="middle" letter-spacing="1">DR.CLİNİC</text>
  <text x="540" y="540" font-family="Arial, sans-serif" font-size="11"
        fill="#880E4F" text-anchor="middle">ÇİLEK ÖZLÜ KREM PEELİNG</text>
  <!-- Strawberry emoji on jar -->
  <text x="540" y="646" font-family="Arial, sans-serif" font-size="64"
        text-anchor="middle">🍓</text>
  <!-- 300ml badge -->
  <circle cx="770" cy="368" r="52" fill="#880E4F" filter="url(#shadow)"/>
  <text x="770" y="363" font-family="Arial, sans-serif" font-size="20" font-weight="bold"
        fill="#FFFFFF" text-anchor="middle">300</text>
  <text x="770" y="383" font-family="Arial, sans-serif" font-size="15"
        fill="#FFD6E2" text-anchor="middle">ml</text>

  <!-- ── PRODUCT NAME ── -->
  <text x="540" y="900" font-family="Georgia, 'Times New Roman', serif"
        font-size="64" font-weight="bold" fill="#880E4F"
        text-anchor="middle" filter="url(#textGlow)" letter-spacing="1">ÇİLEK ÖZLÜ</text>
  <text x="540" y="978" font-family="Georgia, 'Times New Roman', serif"
        font-size="64" font-weight="bold" fill="#C2185B"
        text-anchor="middle" filter="url(#textGlow)" letter-spacing="1">KREM PEELİNG</text>

  <!-- Divider -->
  <line x1="280" y1="1008" x2="800" y2="1008" stroke="#C2185B" stroke-width="2.5" opacity="0.45"/>
  <circle cx="540" cy="1008" r="6" fill="#C2185B"/>

  <!-- ── SLOGAN ── -->
  <text x="540" y="1060" font-family="Georgia, serif"
        font-size="34" font-style="italic" fill="#880E4F"
        text-anchor="middle" letter-spacing="1">Pürüzsüz &amp; Canlı Cilt</text>

  <!-- ── BENEFITS ── -->
  <!-- Benefit 1 -->
  <rect x="90" y="1098" width="900" height="86" rx="43" fill="#FFFFFF" opacity="0.78" filter="url(#cardShadow)"/>
  <circle cx="157" cy="1141" r="30" fill="#C2185B"/>
  <text x="157" y="1149" font-family="Arial, sans-serif" font-size="26"
        fill="#FFFFFF" text-anchor="middle">✦</text>
  <text x="206" y="1133" font-family="Arial, Helvetica, sans-serif"
        font-size="26" font-weight="bold" fill="#880E4F">Kayısı Çekirdeği Tozu</text>
  <text x="206" y="1163" font-family="Arial, Helvetica, sans-serif"
        font-size="22" fill="#555555">Ölü hücrelerden arındırır, pürüzsüz görünüm</text>

  <!-- Benefit 2 -->
  <rect x="90" y="1202" width="900" height="86" rx="43" fill="#FFFFFF" opacity="0.78" filter="url(#cardShadow)"/>
  <circle cx="157" cy="1245" r="30" fill="#C2185B"/>
  <text x="157" y="1253" font-family="Arial, sans-serif" font-size="26"
        fill="#FFFFFF" text-anchor="middle">✦</text>
  <text x="206" y="1237" font-family="Arial, Helvetica, sans-serif"
        font-size="26" font-weight="bold" fill="#880E4F">Panax Ginseng Kök Özü</text>
  <text x="206" y="1267" font-family="Arial, Helvetica, sans-serif"
        font-size="22" fill="#555555">Antioksidan; cilde canlı görünüm kazandırır</text>

  <!-- Benefit 3 -->
  <rect x="90" y="1306" width="900" height="86" rx="43" fill="#FFFFFF" opacity="0.78" filter="url(#cardShadow)"/>
  <circle cx="157" cy="1349" r="30" fill="#C2185B"/>
  <text x="157" y="1357" font-family="Arial, sans-serif" font-size="26"
        fill="#FFFFFF" text-anchor="middle">✦</text>
  <text x="206" y="1341" font-family="Arial, Helvetica, sans-serif"
        font-size="26" font-weight="bold" fill="#880E4F">Gliserin + Hyaluronik Asit</text>
  <text x="206" y="1371" font-family="Arial, Helvetica, sans-serif"
        font-size="22" fill="#555555">Yoğun nemlendirme, yumuşak ve esnek cilt</text>

  <!-- Benefit 4 -->
  <rect x="90" y="1410" width="900" height="86" rx="43" fill="#FFFFFF" opacity="0.78" filter="url(#cardShadow)"/>
  <circle cx="157" cy="1453" r="30" fill="#C2185B"/>
  <text x="157" y="1461" font-family="Arial, sans-serif" font-size="26"
        fill="#FFFFFF" text-anchor="middle">✦</text>
  <text x="206" y="1445" font-family="Arial, Helvetica, sans-serif"
        font-size="26" font-weight="bold" fill="#880E4F">Hoş Koku</text>
  <text x="206" y="1475" font-family="Arial, Helvetica, sans-serif"
        font-size="22" fill="#555555">Cilt bakımını keyifli bir deneyime dönüştürür</text>

  <!-- ── USAGE GUIDE ── -->
  <rect x="90" y="1524" width="900" height="96" rx="20" fill="#880E4F" opacity="0.12"/>
  <rect x="90" y="1524" width="900" height="96" rx="20" fill="none" stroke="#C2185B" stroke-width="2" opacity="0.40"/>
  <text x="540" y="1562" font-family="Arial, Helvetica, sans-serif"
        font-size="22" font-weight="bold" fill="#880E4F"
        text-anchor="middle">NASIL KULLANILIR?</text>
  <text x="540" y="1592" font-family="Arial, Helvetica, sans-serif"
        font-size="20" fill="#555555" text-anchor="middle">Temiz &amp; nemli cilde dairesel hareketlerle uygulayın,</text>
  <text x="540" y="1614" font-family="Arial, Helvetica, sans-serif"
        font-size="20" fill="#555555" text-anchor="middle">bol suyla durulayın.</text>

  <!-- ── CTA BUTTON ── -->
  <rect x="240" y="1660" width="600" height="80" rx="40" fill="#C2185B"/>
  <rect x="242" y="1662" width="596" height="76" rx="39" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.40"/>
  <text x="540" y="1706" font-family="Arial, Helvetica, sans-serif"
        font-size="30" font-weight="bold" fill="#FFFFFF"
        text-anchor="middle" letter-spacing="2">HAFTADA 2–3 KEZ KULLANIN</text>

  <!-- ── WARNING TEXT ── -->
  <text x="540" y="1790" font-family="Arial, Helvetica, sans-serif"
        font-size="17" fill="#888888" text-anchor="middle">
    Harici kullanım içindir. Göz temasından kaçının.
  </text>
  <text x="540" y="1812" font-family="Arial, Helvetica, sans-serif"
        font-size="17" fill="#888888" text-anchor="middle">
    Temas halinde bol su ile yıkayın.
  </text>
  <text x="540" y="1834" font-family="Arial, Helvetica, sans-serif"
        font-size="17" fill="#888888" text-anchor="middle">
    Çocukların ulaşamayacağı ve serin yerde saklayın.
  </text>

  <!-- ── BOTTOM BRAND STRIP ── -->
  <rect x="0" y="1896" width="1080" height="24" fill="#880E4F" rx="0"/>
  <text x="540" y="1913" font-family="Arial, Helvetica, sans-serif"
        font-size="15" fill="#FFD6E2" text-anchor="middle" letter-spacing="3">DR.CLİNİC • drclinic.com.tr</text>
</svg>
