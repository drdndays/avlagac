<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
  <defs>
    <!-- Top half gradient (red) -->
    <linearGradient id="sTopGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#c0112b"/>
      <stop offset="60%" stop-color="#e8174a"/>
      <stop offset="100%" stop-color="#ff6b8a"/>
    </linearGradient>
    <!-- Bottom half gradient (pink/white) -->
    <linearGradient id="sBotGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#fff0f3"/>
      <stop offset="100%" stop-color="#ffe4ec"/>
    </linearGradient>
    <!-- Footer gradient -->
    <linearGradient id="sFootGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#2a0a14"/>
      <stop offset="100%" stop-color="#6b1a28"/>
    </linearGradient>
    <!-- Jar body gradient -->
    <linearGradient id="sJarBody" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffd6df"/>
      <stop offset="50%" stop-color="#ffb8cb"/>
      <stop offset="100%" stop-color="#ff8aaa"/>
    </linearGradient>
    <!-- Jar lid gradient -->
    <linearGradient id="sJarLid" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#e8174a"/>
      <stop offset="100%" stop-color="#c0112b"/>
    </linearGradient>
    <!-- Jar shine -->
    <linearGradient id="sJarShine" x1="0" y1="0" x2="0.3" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- CTA gradient -->
    <linearGradient id="sCtaGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#c0112b"/>
      <stop offset="100%" stop-color="#e8174a"/>
    </linearGradient>
    <!-- Drop shadow for jar -->
    <filter id="sJarShadow" x="-25%" y="-10%" width="150%" height="130%">
      <feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#c0112b" flood-opacity="0.30"/>
    </filter>
    <!-- Card shadow -->
    <filter id="sCardShadow" x="-5%" y="-5%" width="115%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#c0112b" flood-opacity="0.12"/>
    </filter>
    <!-- Badge shadow -->
    <filter id="sBadgeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#e8174a" flood-opacity="0.30"/>
    </filter>
    <!-- Decorative overlay circles for top half -->
    <radialGradient id="sCircle1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sCircle2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── Background top half ── -->
  <rect x="0" y="0" width="1080" height="960" fill="url(#sTopGrad)"/>

  <!-- ── Background bottom half ── -->
  <rect x="0" y="960" width="1080" height="960" fill="url(#sBotGrad)"/>

  <!-- ── Wave divider (white wave at 880px from top) ── -->
  <path d="M0,880 C270,980 810,980 1080,880 L1080,1920 L0,1920 Z" fill="#fff0f3"/>

  <!-- Decorative circles on top half -->
  <circle cx="-80" cy="330" r="300" fill="url(#sCircle1)"/>
  <circle cx="1130" cy="520" r="200" fill="url(#sCircle2)"/>

  <!-- Decorative strawberries -->
  <text x="0" y="870" font-size="120" opacity="0.15" transform="rotate(-20,60,820)">🍓</text>
  <text x="960" y="1320" font-size="80" opacity="0.15" transform="rotate(15,1000,1300)">🍓</text>

  <!-- ── Top brand bar ── -->
  <text x="60" y="116" font-family="Poppins, Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="4">Dr.Clinic</text>
  <text x="1020" y="110" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="300" fill="rgba(255,255,255,0.7)" letter-spacing="3">DERMATOLOJI</text>
  <!-- separator dot -->
  <circle cx="540" cy="90" r="8" fill="rgba(255,255,255,0.6)"/>

  <!-- ── Hero headline ── -->
  <text x="540" y="230" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="26" font-weight="300" fill="rgba(255,255,255,0.85)" letter-spacing="5">VÜCUT BAKIMI · BODY CARE</text>
  <text x="540" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="96" font-weight="700" fill="#ffffff">Pürüzsüz</text>
  <text x="540" y="460" text-anchor="middle" font-family="Georgia, serif" font-size="96" font-weight="700" fill="#ffffff">&amp; Yumuşak</text>
  <text x="540" y="526" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="32" font-weight="300" fill="rgba(255,255,255,0.9)" letter-spacing="1">Çilek Özlü Krem Peeling</text>

  <!-- ── Product jar illustration (center, straddles wave) ── -->
  <g transform="translate(300, 555)" filter="url(#sJarShadow)">
    <!-- Jar body -->
    <rect x="0" y="140" width="480" height="400" rx="36" fill="url(#sJarBody)"/>
    <rect x="0" y="140" width="480" height="400" rx="36" fill="url(#sJarShine)"/>
    <!-- Lid -->
    <rect x="-24" y="76" width="528" height="84" rx="26" fill="url(#sJarLid)"/>
    <rect x="0" y="84" width="310" height="32" rx="14" fill="rgba(255,255,255,0.28)"/>
    <!-- Label area -->
    <rect x="20" y="192" width="440" height="302" rx="20" fill="rgba(255,255,255,0.72)"/>
    <!-- Dr.Clinic on lid -->
    <text x="240" y="132" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="32" fill="#ffffff" letter-spacing="4">Dr.Clinic</text>
    <!-- Product name on label -->
    <text x="240" y="254" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="22" fill="#c0112b" letter-spacing="2">BODY CREAM SCRUB</text>
    <text x="240" y="284" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-weight="300" font-size="18" fill="#6b3040">Çilek Özlü Krem Peeling</text>
    <!-- Strawberry on label -->
    <text x="240" y="418" text-anchor="middle" font-size="94">🍓</text>
    <!-- 300 ml -->
    <text x="240" y="476" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="28" fill="#c0112b">300 ml</text>
    <!-- Corner decorations -->
    <circle cx="38" cy="176" r="10" fill="rgba(232,23,74,0.3)"/>
    <circle cx="442" cy="176" r="10" fill="rgba(232,23,74,0.3)"/>
  </g>

  <!-- ── Volume badge (top-right) ── -->
  <g filter="url(#sBadgeShadow)">
    <circle cx="960" cy="686" r="90" fill="#ffffff"/>
  </g>
  <text x="960" y="666" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="38" font-weight="700" fill="#c0112b">300</text>
  <text x="960" y="695" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="300" fill="#7a3040">ml</text>
  <text x="960" y="718" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="600" fill="#e8174a" letter-spacing="1">SCRUB</text>

  <!-- ── Three benefit pills ── -->
  <!-- Pill 1: Arındırır -->
  <g filter="url(#sCardShadow)">
    <rect x="54" y="1180" width="298" height="180" rx="28" fill="#ffffff"/>
  </g>
  <text x="203" y="1248" text-anchor="middle" font-size="52">✨</text>
  <text x="203" y="1292" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="700" fill="#2a0a14">Arındırır</text>
  <text x="203" y="1316" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="300" fill="#7a3040">Kayısı çekirdeği</text>
  <text x="203" y="1336" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="300" fill="#7a3040">tozu</text>

  <!-- Pill 2: Canlandırır -->
  <g filter="url(#sCardShadow)">
    <rect x="391" y="1180" width="298" height="180" rx="28" fill="#ffffff"/>
  </g>
  <text x="540" y="1248" text-anchor="middle" font-size="52">🌿</text>
  <text x="540" y="1292" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="700" fill="#2a0a14">Canlandırır</text>
  <text x="540" y="1316" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="300" fill="#7a3040">Panax ginseng</text>
  <text x="540" y="1336" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="300" fill="#7a3040">kök özü</text>

  <!-- Pill 3: Nemlendirir -->
  <g filter="url(#sCardShadow)">
    <rect x="728" y="1180" width="298" height="180" rx="28" fill="#ffffff"/>
  </g>
  <text x="877" y="1248" text-anchor="middle" font-size="52">💧</text>
  <text x="877" y="1292" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="700" fill="#2a0a14">Nemlendirir</text>
  <text x="877" y="1316" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="300" fill="#7a3040">Hyaluronik</text>
  <text x="877" y="1336" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="300" fill="#7a3040">asit &amp; gliserin</text>

  <!-- ── Full benefit list ── -->
  <g filter="url(#sCardShadow)">
    <rect x="54" y="1390" width="972" height="290" rx="28" fill="rgba(255,255,255,0.75)"/>
    <rect x="54" y="1390" width="972" height="290" rx="28" fill="none" stroke="rgba(255,150,170,0.25)" stroke-width="1"/>
  </g>
  <!-- Benefit list items -->
  <text x="96" y="1437" font-size="26">🌸</text>
  <text x="140" y="1437" font-family="Poppins, Arial, sans-serif" font-size="20" fill="#2a0a14">Kayısı çekirdeği tozu ile cildi ölü hücrelerden arındırır; pürüzsüz ve yumuşak görünüm.</text>
  <line x1="96" y1="1452" x2="1006" y2="1452" stroke="rgba(200,20,60,0.1)" stroke-width="1"/>

  <text x="96" y="1497" font-size="26">🌿</text>
  <text x="140" y="1497" font-family="Poppins, Arial, sans-serif" font-size="20" fill="#2a0a14">Panax ginseng kök özü antioksidan özelliği ile cilde canlı görünüm kazandırmaya yardımcı olur.</text>
  <line x1="96" y1="1513" x2="1006" y2="1513" stroke="rgba(200,20,60,0.1)" stroke-width="1"/>

  <text x="96" y="1557" font-size="26">💧</text>
  <text x="140" y="1557" font-family="Poppins, Arial, sans-serif" font-size="20" fill="#2a0a14">Gliserin ve hyaluronik asit ile nemlendirir.</text>
  <line x1="96" y1="1572" x2="1006" y2="1572" stroke="rgba(200,20,60,0.1)" stroke-width="1"/>

  <text x="96" y="1617" font-size="26">🍓</text>
  <text x="140" y="1617" font-family="Poppins, Arial, sans-serif" font-size="20" fill="#2a0a14">Hoş kokusuyla bakım keyifli.</text>

  <!-- ── Usage & warning block ── -->
  <g filter="url(#sCardShadow)">
    <rect x="54" y="1702" width="972" height="120" rx="22" fill="rgba(255,255,255,0.60)"/>
    <rect x="54" y="1702" width="972" height="120" rx="22" fill="none" stroke="rgba(255,150,170,0.25)" stroke-width="1"/>
  </g>
  <text x="90" y="1736" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#c0112b">📋 Kullanım:</text>
  <text x="90" y="1762" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="300" fill="#6b3040">Temiz ve nemli cilde dairesel hareketlerle masaj yaparak uygulayın ve bol suyla durulayın. Haftada 2–3 kez.</text>
  <text x="90" y="1802" font-family="Poppins, Arial, sans-serif" font-size="16" fill="#a05060">⚠️ Harici kullanım içindir. Göz ile temasından kaçının.</text>

  <!-- ── CTA button ── -->
  <rect x="330" y="1840" width="420" height="60" rx="30" fill="url(#sCtaGrad)"/>
  <text x="540" y="1879" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="2">Şimdi Keşfet</text>

  <!-- Swipe hint -->
  <text x="540" y="1912" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="300" fill="#c0112b" letter-spacing="2">↑ YUKARI KAYDIR</text>

  <!-- ── Footer ── -->
  <rect x="0" y="1850" width="1080" height="70" fill="url(#sFootGrad)"/>
  <text x="540" y="1892" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.6)" letter-spacing="2">Dr.Clinic · drclinic.com.tr · @drclinic</text>
</svg>
